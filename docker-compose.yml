services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: multazim
      POSTGRES_PASSWORD: multazim
      POSTGRES_DB: multazim
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multazim -d multazim"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: ./apps/api
    command: ["python", "/workspace/scripts/migrate.py"]
    working_dir: /workspace
    environment:
      DATABASE_URL: postgresql://multazim:multazim@postgres:5432/multazim
    volumes:
      - ./:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports: ["6379:6379"]

  api:
    build: ./apps/api
    environment:
      SQLITE_PATH: /data/multazim.db
      DATABASE_URL: postgresql://multazim:multazim@postgres:5432/multazim
      PUBLIC_API_URL: http://localhost:8000
      REDIS_URL: redis://redis:6379
      AI_PROVIDER: mock
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /data/evidence
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - evidence_data:/data/evidence
    ports: ["8000:8000"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  evidence_data:
